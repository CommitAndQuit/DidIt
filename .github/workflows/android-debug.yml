name: Android Debug Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with LFS model)
        uses: actions/checkout@v4
        with:
          # The bundled .litertlm model is stored in Git LFS and is required
          # to package the APK's assets, so pull LFS objects.
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Publish a GitHub Release with the debug APK attached. Runs on pushes to
      # the default branch and manual dispatches (not on every feature branch).
      - name: Publish debug release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.run_number }}
          name: Debug build ${{ github.run_number }}
          body: |
            Automated debug build from ${{ github.sha }}.
            > Debug APK — not for production. Signed with the debug keystore.
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk
